<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="facet-slate-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="facet-slate-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="facet-slate-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="facet-obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 512)" filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="36" stroke-linejoin="round" />

      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#00f5ff" stroke-width="3.5" opacity="0.45" stroke-dasharray="14, 10" />

      <!-- Geometric Origami Crane (Tsuru) - Precision Vector Folds -->
      <g stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">

        <!-- Back Tail / Rear Spine -->
        <polygon points="0,70 -45,260 0,310" fill="url(#facet-slate-dark)" />
        <polygon points="0,70 0,310 45,260" fill="url(#facet-obsidian)" />

        <!-- Outer Wing Left Top -->
        <polygon points="0,-40 -270,-180 -120,-10" fill="url(#facet-slate-light)" />
        <!-- Outer Wing Left Lower Flap -->
        <polygon points="-270,-180 -300,-100 -120,-10" fill="url(#facet-slate-mid)" />
        <polygon points="-300,-100 -210,50 -120,-10" fill="url(#facet-slate-dark)" />

        <!-- Outer Wing Right Top -->
        <polygon points="0,-40 120,-10 270,-180" fill="url(#facet-slate-mid)" />
        <!-- Outer Wing Right Lower Flap -->
        <polygon points="270,-180 120,-10 300,-100" fill="url(#facet-slate-dark)" />
        <polygon points="300,-100 120,-10 210,50" fill="url(#facet-obsidian)" />

        <!-- Inner Body Keel (Folded Diamond Core) -->
        <polygon points="0,-40 -120,-10 -65,110 0,70" fill="url(#facet-slate-mid)" />
        <polygon points="0,-40 0,70 65,110 120,-10" fill="url(#facet-slate-dark)" />

        <!-- Lower Keel Triangles -->
        <polygon points="0,70 -65,110 0,210" fill="url(#facet-slate-dark)" />
        <polygon points="0,70 0,210 65,110" fill="url(#facet-obsidian)" />

        <!-- Neck Base & Extension -->
        <polygon points="0,-40 -50,-120 0,-170" fill="url(#facet-slate-light)" />
        <polygon points="0,-40 0,-170 50,-120" fill="url(#facet-slate-mid)" />

        <polygon points="0,-170 -35,-230 0,-270" fill="url(#facet-slate-light)" />
        <polygon points="0,-170 0,-270 35,-230" fill="url(#facet-slate-mid)" />

        <!-- Head / Beak (Sharp origami fold) -->
        <polygon points="0,-270 -20,-290 0,-330" fill="#38bdf8" />
        <polygon points="0,-270 0,-330 20,-290" fill="#0284c7" />

        <!-- Beak Apex Tip -->
        <polygon points="0,-330 -10,-355 0,-350" fill="#00f5ff" />
        <polygon points="0,-330 0,-350 10,-355" fill="#0284c7" />

      </g>

      <!-- Precision Crease / Accent Vectors -->
      <line x1="0" y1="-350" x2="0" y2="310" stroke="#00f5ff" stroke-width="3" stroke-linecap="round" opacity="0.85" />
      <line x1="-270" y1="-180" x2="0" y2="-40" stroke="#00f5ff" stroke-width="2" opacity="0.6" />
      <line x1="270" y1="-180" x2="0" y2="-40" stroke="#00f5ff" stroke-width="2" opacity="0.6" />
      <line x1="-120" y1="-10" x2="0" y2="70" stroke="#38bdf8" stroke-width="2" opacity="0.5" />
      <line x1="120" y1="-10" x2="0" y2="70" stroke="#38bdf8" stroke-width="2" opacity="0.5" />

      <!-- Center Vector Core Dot -->
      <circle cx="0" cy="-40" r="7" fill="#00f5ff" stroke="#0f172a" stroke-width="2" />
      <circle cx="0" cy="-40" r="3" fill="#ffffff" />

    </g>
  </g>
</svg>